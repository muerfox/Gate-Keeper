# Gate Keeper Redis configuration.
#
# Redis here holds ephemeral security state only (rate-limit counters,
# challenge/token replay markers, distributed locks) — nothing that requires
# long-term durability. AOF is enabled with a conservative fsync policy so a
# crash does not silently resurrect already-consumed tokens as "unconsumed."

appendonly yes
appendfsync everysec

# Refuse to silently evict security-critical keys under memory pressure;
# prefer OOM errors (surfaced as a degraded-mode security event, see
# docs/ARCHITECTURE.md §Failure Modes) over quietly losing replay state.
maxmemory-policy noeviction

protected-mode yes
