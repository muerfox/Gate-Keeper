version: "3.9"

# Local / self-hosted deployment. See docs/OFFLINE_MODE.md for air-gapped
# setups that omit the shared postgres+redis entirely.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: gatekeeper
    volumes:
      - gatekeeper_pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - gatekeeper_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gatekeeper:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/gatekeeper
      REDIS_URL: redis://redis:6379
      GATEKEEPER_SIGNING_KEY: ${GATEKEEPER_SIGNING_KEY:?set a base64 Ed25519 seed, see docs/OFFLINE_MODE.md}
      GATEKEEPER_REDIS_FAILURE_POLICY: ${GATEKEEPER_REDIS_FAILURE_POLICY:-fail_closed}
      NODE_ENV: production
      PORT: "8080"
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_GATEKEEPER_API_URL: http://localhost:8080
    ports:
      - "5173:80"

volumes:
  gatekeeper_pg_data:
  gatekeeper_redis_data:
